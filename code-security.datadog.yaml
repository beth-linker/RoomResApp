schema-version: v1.5

sast:
  use-default-rulesets: true
  global-config:
    ignore-paths:
      - "drizzle/**"

sca:
  ignore-paths:
    - "**/node_modules/**"

iac:
  global-config:
    ignore-paths:
      - ".next/**"

secrets:
  global-config:
    use-gitignore: true
    ignore-generated-files: true
    ignore-paths:
      - "package-lock.json"
      - "drizzle/meta/**"
